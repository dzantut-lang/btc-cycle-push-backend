name: Backend tests
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check trader-radar.js
      - run: node --check public/trader-radar-panel.js
      - run: npm test
